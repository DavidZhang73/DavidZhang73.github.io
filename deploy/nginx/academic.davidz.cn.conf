server {
    listen 80;
    server_name academic.davidz.cn;
    rewrite ^(.*) https://$server_name$1 permanent;
}

server {
    listen 443 ssl;
    include /docker/nginx/config/snippets/http2.inc;
    access_log /docker/nginx/logs/static-performance.jsonl static_perf buffer=64k flush=5s;
    server_name academic.davidz.cn;
    charset UTF-8;
    client_max_body_size 75M;

    include conf.d/ssl.conf;

    location / {
        include /docker/nginx/config/snippets/academic-cache-headers.inc;
        include /docker/nginx/config/snippets/static-compression.inc;
        root /docker/academic;
        index index.html;
    }

    error_page 404 /404.html;
}

# Loaded by conf.d/*.conf in the http context. Academic uses a separate policy;
# the existing shared static-cache-map.inc remains unchanged.
# Classify by URI, not $sent_http_content_type: Nginx clears Content-Type on 304.
map $uri $academic_cache_candidate {
    default "no-cache";

    # Hugo fingerprints and image-processing names change when the asset changes.
    "~*\.[0-9a-f]{32,64}\.(css|js)$" "public, max-age=31536000, immutable";
    "~*/[^/]+_hu[0-9a-f]{32}_[^/]+\.(avif|webp|jpe?g|png|gif)$" "public, max-age=31536000, immutable";

    "~*\.(avif|webp|jpe?g|png|gif|svg|ico|woff2?|ttf|otf|eot)$" "public, max-age=604800";
    "~*\.(css|js)$" "public, max-age=3600";

    # The browser revalidates; Cloudflare can serve a fresh copy for ten minutes.
    "~/$" "public, max-age=0, s-maxage=600";
    "~*\.html$" "public, max-age=0, s-maxage=600";
}

# $uri becomes /index.html during index resolution; retain the original root URL.
map $request_uri $academic_language_entrypoint {
    default 0;
    "~^/(\?|$)" 1;
}

# Never cache error responses as immutable assets, including missing image URLs.
map "$academic_language_entrypoint:$status" $academic_cache_control {
    default "no-store";
    "~^1:(200|206|304)$" "no-cache";
    "0:200" $academic_cache_candidate;
    "0:206" $academic_cache_candidate;
    "0:304" $academic_cache_candidate;
}

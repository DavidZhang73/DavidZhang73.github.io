name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable quotePath
        run: git config core.quotePath false
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.3'
          extended: true
      - name: Build
        run: hugo --gc --minify
      - name: Deploy with strict SSH verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SF_DEPLOY_HOST: ${{ vars.SF_DEPLOY_HOST }}
          SF_DEPLOY_USER: ${{ vars.SF_DEPLOY_USER }}
          SF_DEPLOY_PORT: ${{ vars.SF_DEPLOY_PORT }}
          SF_TARGET: ${{ vars.SF_TARGET }}
          SF_SSH_KNOWN_HOSTS: ${{ vars.SF_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deploy_academic.py
      - name: Deploy to GitHub Page
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public

name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable quotePath
        run: git config core.quotePath false
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.3'
          extended: true
      - name: Build
        run: hugo --gc --minify
      - name: Deploy with strict SSH verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "101.132.243.87"
          test "$DEPLOY_USER" = "root"
          test "$DEPLOY_PORT" = "22"
          test "$TARGET" = "/opt/1panel/www/sites/academic.davidz.cn/index/"
          test -s public/index.html
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          chmod 600 "$key_file" "$hosts_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh_opts=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -p "$DEPLOY_PORT")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$TARGET' && test ! -L '$TARGET'"
          printf -v RSYNC_RSH '%q ' ssh "${ssh_opts[@]}"
          export RSYNC_RSH
          rsync -rltgoDzvO --delete --delay-updates public/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET"
      - name: Deploy to GitHub Page
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public

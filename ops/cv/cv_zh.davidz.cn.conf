# Minimal CV-only vhost. Reuses the existing wildcard certificate; no R2 redirect.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name cv_zh.davidz.cn;
    ssl_certificate /www/sites/academic.davidz.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/academic.davidz.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    location = / { rewrite ^ /cv_zh.pdf last; }
    location = /cv_zh.pdf {
        alias /www/cv-assets/public/cv_zh.pdf;
        types { }
        default_type application/pdf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'inline; filename="cv_zh.pdf"';
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / { return 404; }
}

    # Academic root language selection; DEFAULT_LANGUAGE is host-specific.
    location = / {
        content_by_lua_block {
            local args, err = ngx.req.get_uri_args(100)
            ngx.header['Cache-Control'] = 'private, no-store'
            if err then return ngx.exit(400) end
            local choice = args.lang
            local manual = type(choice) == 'string' and (choice == 'en' or choice == 'zh')
            local stored
            for part in ((ngx.var.http_cookie or '') .. ';'):gmatch('(.-);') do
                local value = part:match('^%s*__Host%-academic_language=(%a+)%s*$')
                if value == 'en' or value == 'zh' then stored = value end
            end
            local language = manual and choice or stored or 'DEFAULT_LANGUAGE'
            if manual then
                ngx.header['Set-Cookie'] = '__Host-academic_language=' .. language .. '; Path=/; Max-Age=31536000; Secure; SameSite=Lax'
            end
            args.lang = nil
            local query = ngx.encode_args(args)
            return ngx.redirect('https://academic.davidz.cn/' .. language .. '/' .. (query ~= '' and ('?' .. query) or ''), 302)
        }
    }
